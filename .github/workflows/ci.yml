name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Allow unprivileged ping for the ping tests
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: go test -race
        run: go test -race ./...
      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./cmd/vexil

  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race -tags chrome
        run: go test -race -tags chrome ./internal/web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vexil:ci
      - name: Check HTTPS and the health check inside the image
        run: |
          docker run -d --name vexil -p 8080:8080 vexil:ci
          # The commands use the bare name: the binary must be on PATH.
          for i in $(seq 1 20); do
            if docker exec vexil vexil healthcheck; then break; fi
            sleep 1
          done
          docker exec vexil vexil healthcheck
          # /data belongs to the nonroot user and the database was created.
          docker exec vexil vexil healthcheck | grep -q '"database":"ok"'
          docker inspect --format '{{.Config.User}}' vexil | grep -q 65532
          # A public monitor check over HTTPS proves the CA certificates work.
          curl -fsS -c jar -b jar -o /dev/null -d 'password=ci-password-1&confirm=ci-password-1' http://127.0.0.1:8080/setup
          curl -fsS -c jar -b jar -o /dev/null -d 'type=http&url=https://github.com&interval=60&public=1' http://127.0.0.1:8080/monitors/new
          sleep 5
          curl -fsS http://127.0.0.1:8080/badge/1.svg | grep -q '>up<'
          # The password reset from SPEC 4.3 runs in the image. CI has no
          # terminal, so the passwords come on stdin instead of with -t.
          printf 'ci-password-2\nci-password-2\n' | docker exec -i vexil vexil reset-password
          test "$(curl -sS -o /dev/null -w '%{http_code}' -d 'password=ci-password-2' http://127.0.0.1:8080/login)" = 303
          docker logs vexil
          docker rm -f vexil
