version: 2
project_name: vexil

builds:
  - main: ./cmd/vexil
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      # The README links to these files, so they keep their paths. The OFL
      # must travel with the font.
      - web/static/fonts/OFL.txt
      - web/static/brand/LICENSE
      - docs/screenshots/*.png

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^Merge"
  # Every commit message starts with a prefix (CLAUDE.md). Other holds
  # commits from before that rule and chore: commits.
  groups:
    - title: Fixes
      regexp: "^fix:"
      order: 0
    - title: Performance
      regexp: "^perf:"
      order: 1
    - title: Features
      regexp: "^feat:"
      order: 2
    - title: Other
      order: 999

release:
  # A tag with a pre-release suffix makes a pre-release on GitHub.
  prerelease: auto
  footer: |
    Docker image: `ghcr.io/inatthegeekend/vexil:{{ .Version }}`
